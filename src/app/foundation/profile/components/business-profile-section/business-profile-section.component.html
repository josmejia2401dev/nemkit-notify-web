<section class="panel profile-settings-card">
  <div class="section-heading">
    <div>
      <p class="eyebrow">DETALLES DE LA CUENTA</p>
      <h3>Empresa</h3>
      <p>El nombre con el que identificas tu cuenta en la plataforma.</p>
    </div>
    <span class="section-mark"><i class="pi pi-shop" aria-hidden="true"></i></span>
  </div>

  <form class="profile-form" (ngSubmit)="submit()">
    <label class="form-field">
      <span>Nombre de la empresa <b>*</b></span>
      <input
        [(ngModel)]="name"
        name="companyName"
        autocomplete="organization"
        maxlength="100"
        minlength="2"
        required
      />
    </label>

    <div class="profile-form-footer">
      <button class="button button-primary" [disabled]="saving">
        <i [class]="saving ? 'pi pi-spin pi-spinner' : 'pi pi-check'" aria-hidden="true"></i>
        {{ saving ? "Guardando…" : "Guardar empresa" }}
      </button>
    </div>
  </form>
</section>
